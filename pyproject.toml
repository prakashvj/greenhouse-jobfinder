[project]
name = "greenhouse-jobfinder"
version = "0.1.0"
description = "Fetch Greenhouse-hosted job boards and rank postings against a resume"
requires-python = ">=3.10"
dependencies = [
    "pypdf",
    "python-docx",
    "httpx",
    "pyyaml",
    "flask",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
jobfinder = "jobfinder.cli:main"
jobfinder-web = "jobfinder.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobfinder*"]
